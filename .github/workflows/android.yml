name: Android Pipeline

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      validation:
        description: Validation level for a manually triggered run
        required: true
        default: full
        type: choice
        options:
          - full
          - fast

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

env:
  RELEASE_VALIDATION: ${{ github.event.inputs.validation || 'full' }}

jobs:
  android:
    name: Android - Analyze, Test and Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify toolchain
        working-directory: apps/flutter
        run: |
          flutter --version
          java -version
          echo "Application ID: ${{ vars.ANDROID_APPLICATION_ID }}"
          echo "Firebase project: ${{ vars.FIREBASE_PROJECT_ID }}"

      - name: Get Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Restore Firebase configuration
        working-directory: apps/flutter
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ vars.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Validate Firebase configuration
        working-directory: apps/flutter
        env:
          EXPECTED_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          path = "android/app/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          expected_project = os.environ["EXPECTED_FIREBASE_PROJECT_ID"]
          actual_project = data.get("project_info", {}).get("project_id")
          if actual_project != expected_project:
              raise SystemExit(
                  f"Firebase project mismatch: expected {expected_project!r}, got {actual_project!r}"
              )

          expected_app = os.environ["EXPECTED_APPLICATION_ID"]
          clients = data.get("client", [])
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          }
          if expected_app not in package_names:
              raise SystemExit(
                  f"Android package {expected_app!r} is not present in google-services.json"
              )

          print("Firebase project and Android application ID validated.")
          PY

      - name: Restore Android signing configuration
        working-directory: apps/flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

          test -s android/release-keystore.jks
          test -s android/key.properties

      - name: Analyze
        if: ${{ env.RELEASE_VALIDATION == 'full' }}
        working-directory: apps/flutter
        run: flutter analyze

      - name: Run tests
        if: ${{ env.RELEASE_VALIDATION == 'full' }}
        working-directory: apps/flutter
        run: flutter test

      - name: Verify Android release signing configuration
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          grep -q 'signingConfigs' android/app/build.gradle.kts
          grep -q 'key.properties' android/app/build.gradle.kts
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Generate release version
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          BASE_VERSION=$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*.*$/\1/p' pubspec.yaml)
          if [ -z "$BASE_VERSION" ]; then
            echo "Unable to extract major.minor version from pubspec.yaml"
            exit 1
          fi

          MAJOR_VERSION=$(printf '%s' "$BASE_VERSION" | cut -d. -f1)
          MINOR_VERSION=$(printf '%s' "$BASE_VERSION" | cut -d. -f2)
          RELEASE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}.$(printf '%02d' "${GITHUB_RUN_ATTEMPT}")"
          PLAY_VERSION_CODE=$((10#$MAJOR_VERSION * 10000000 + 10#$MINOR_VERSION * 1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Publishing versionName: $RELEASE_VERSION"
          echo "Publishing versionCode: $PLAY_VERSION_CODE"

      - name: Build signed Android App Bundle
        if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/flutter
        run: flutter build appbundle --release

      - name: Build signed release App Bundle
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/flutter
        run: |
          flutter build appbundle --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$PLAY_VERSION_CODE" \
            --dart-define=JCP_API_BASE_URL="${{ vars.JCP_API_BASE_URL }}"

      - name: Verify signed AAB
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "Signed AAB verified: $AAB"

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: myjinalay-release-aab-${{ github.run_number }}
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Validate Google Play publishing configuration
        if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && vars.GOOGLE_PLAY_PUBLISH == 'true' }}
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_STORE_SERVICE_ACCOUNT_JSON"

      - name: Publish to Google Play internal testing
        if: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && vars.GOOGLE_PLAY_PUBLISH == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_APPLICATION_ID }}
          releaseFiles: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: CI build ${{ env.PLAY_VERSION_CODE }}
