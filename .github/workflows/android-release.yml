name: Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      validation:
        description: Release validation level
        required: true
        default: full
        type: choice
        options:
          - full
          - fast
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  RELEASE_VALIDATION: ${{ github.event.inputs.validation || 'full' }}

jobs:
  build-android:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code
        if: ${{ env.RELEASE_VALIDATION == 'full' }}
        run: |
          flutter analyze
          flutter test

      - name: Validate required release configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
          JCP_API_BASE_URL: ${{ vars.JCP_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing GitHub Actions variable: GOOGLE_SERVICES_JSON"; exit 1; }
          test -n "$JCP_API_BASE_URL" || { echo "Missing GitHub Actions variable: JCP_API_BASE_URL"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing GitHub Actions secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "Missing GitHub Actions secret: ANDROID_STORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing GitHub Actions secret: ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing GitHub Actions secret: ANDROID_KEY_ALIAS"; exit 1; }

      - name: Inject Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          jq empty android/app/google-services.json

          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android/app/google-services.json)
          test "$PROJECT_ID" = "jain-community-platform"

          PACKAGE_NAME=$(jq -r '.client[]?.client_info.android_client_info.package_name // empty' android/app/google-services.json | grep -Fx 'com.nipun.jcp' | head -n 1)
          test "$PACKAGE_NAME" = "com.nipun.jcp"

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/jcp-upload.jks
          test -s android/app/jcp-upload.jks

      - name: Create signing properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=jcp-upload.jks
          EOF

      - name: Verify Android release signing configuration
        run: |
          grep -q 'signingConfigs' android/app/build.gradle.kts
          grep -q 'key.properties' android/app/build.gradle.kts
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Generate Play Store version
        run: |
          BASE_VERSION=$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*.*$/\1/p' pubspec.yaml)
          if [ -z "$BASE_VERSION" ]; then
            echo "Unable to extract major.minor version from pubspec.yaml"
            exit 1
          fi

          MAJOR_VERSION=$(printf '%s' "$BASE_VERSION" | cut -d. -f1)
          MINOR_VERSION=$(printf '%s' "$BASE_VERSION" | cut -d. -f2)
          RELEASE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}.$(printf '%02d' "$GITHUB_RUN_ATTEMPT")"
          PLAY_VERSION_CODE=$((10#$MAJOR_VERSION * 10000000 + 10#$MINOR_VERSION * 1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Publishing versionName: $RELEASE_VERSION"
          echo "Publishing versionCode: $PLAY_VERSION_CODE"

      - name: Build signed app bundle
        run: |
          flutter build appbundle --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$PLAY_VERSION_CODE" \
            --dart-define=JCP_API_BASE_URL="${{ vars.JCP_API_BASE_URL }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: jcp-release-aab-${{ env.PLAY_VERSION_CODE }}
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Google Play
        if: ${{ vars.GOOGLE_PLAY_PUBLISH == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.nipun.jcp
          releaseFiles: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: CI build ${{ env.PLAY_VERSION_CODE }}
