name: CI

on:
  pull_request:
    branches:
      - master
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      scope:
        description: What should CI validate?
        required: true
        type: choice
        default: full
        options:
          - full
          - frontend
          - backend
          - repository
          - android

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'repository' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate public repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/copilot-instructions.md
          test -f README.md
          test -d apps
          test -d .github/workflows

  frontend:
    name: Frontend - Flutter analyze and test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'frontend' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check frontend availability
        id: frontend
        shell: bash
        run: |
          if [ -f apps/flutter/pubspec.yaml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Flutter frontend is not present yet; skipping frontend validation."
          fi
      - name: Set up Flutter
        if: steps.frontend.outputs.available == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Get dependencies
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/flutter
        run: flutter pub get
      - name: Analyze
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/flutter
        run: flutter analyze
      - name: Run tests
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/flutter
        run: flutter test

  backend:
    name: Backend - NestJS lint, test and build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'backend' }}
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jcp
          POSTGRES_PASSWORD: jcp
          POSTGRES_DB: jain_community_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jcp -d jain_community_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check backend availability
        id: backend
        shell: bash
        run: |
          if [ -f apps/api/package.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NestJS backend is not present yet; skipping backend validation."
          fi
      - name: Set up Node.js
        if: steps.backend.outputs.available == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        run: npm run prisma:generate --if-present
      - name: Apply database migrations
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm run prisma:migrate:deploy --if-present
      - name: Lint
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        run: npm run lint --if-present
      - name: Unit tests
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm test --if-present
      - name: Integration tests
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm run test:integration --if-present
      - name: Build
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm run build --if-present

  android:
    name: Android - Analyze, Test and Build AAB
    if: ${{ github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'android') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Verify toolchain
        working-directory: apps/flutter
        run: |
          flutter --version
          java -version
          echo "Application ID: ${{ vars.ANDROID_APPLICATION_ID }}"
          echo "Firebase project: ${{ vars.FIREBASE_PROJECT_ID }}"
      - name: Get Flutter dependencies
        working-directory: apps/flutter
        run: flutter pub get
      - name: Restore Firebase configuration
        working-directory: apps/flutter
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ vars.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
      - name: Validate Firebase configuration
        working-directory: apps/flutter
        env:
          EXPECTED_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
          EXPECTED_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          path = "android/app/google-services.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          expected_project = os.environ["EXPECTED_FIREBASE_PROJECT_ID"]
          actual_project = data.get("project_info", {}).get("project_id")
          if actual_project != expected_project:
              raise SystemExit(f"Firebase project mismatch: expected {expected_project!r}, got {actual_project!r}")
          expected_app = os.environ["EXPECTED_APPLICATION_ID"]
          clients = data.get("client", [])
          package_names = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          }
          if expected_app not in package_names:
              raise SystemExit(f"Android package {expected_app!r} is not present in google-services.json")
          print("Firebase project and Android application ID validated.")
          PY
      - name: Restore Android signing configuration
        working-directory: apps/flutter
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../release-keystore.jks
          EOF
          test -s android/release-keystore.jks
          test -s android/key.properties
      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: Run tests
        working-directory: apps/flutter
        run: flutter test
      - name: Verify Android release signing configuration
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          grep -q 'signingConfigs' android/app/build.gradle.kts
          grep -q 'key.properties' android/app/build.gradle.kts
          grep -q 'signingConfigs.getByName("release")' android/app/build.gradle.kts
      - name: Build signed Android App Bundle
        if: ${{ github.event_name != 'push' }}
        working-directory: apps/flutter
        run: flutter build appbundle --release
      - name: Verify signed AAB
        if: ${{ github.event_name != 'push' }}
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          echo "Signed AAB verified: $AAB"
      - name: Upload Android App Bundle
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: myjinalay-pr-aab-${{ github.run_number }}
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  merge-gate:
    name: Merge gate
    if: ${{ always() }}
    needs: [repository, frontend, backend, android]
    runs-on: ubuntu-26.04
    steps:
      - name: Verify required validation jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository: ${{ needs.repository.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Android: ${{ needs.android.result }}"
          if [[ "${{ needs.repository.result }}" == "failure" || "${{ needs.repository.result }}" == "cancelled" ||
                "${{ needs.frontend.result }}" == "failure" || "${{ needs.frontend.result }}" == "cancelled" ||
                "${{ needs.backend.result }}" == "failure" || "${{ needs.backend.result }}" == "cancelled" ||
                "${{ needs.android.result }}" == "failure" || "${{ needs.android.result }}" == "cancelled" ]]; then
            echo "One or more validation jobs failed or were cancelled."
            exit 1
          fi
          echo "All applicable validation jobs passed."

      - name: Publish merge-gate commit status
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json
          print(json.dumps({
              "state": "success",
              "context": "Merge gate",
              "description": "All required CI validation jobs passed."
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "${payload}"

      - name: Publish merge-gate status on the test merge commit
        if: ${{ success() && github.event_name == 'pull_request' && github.sha != github.event.pull_request.head.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload='{"state":"success","context":"Merge gate","description":"All required CI validation jobs passed."}'
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "${payload}"
