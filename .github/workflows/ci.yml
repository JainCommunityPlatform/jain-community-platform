name: CI

on:
  pull_request:
    branches:
      - master
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      scope:
        description: What should CI validate?
        required: true
        type: choice
        default: full
        options:
          - full
          - frontend
          - backend
          - repository

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository validation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'repository' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/copilot-instructions.md
          test -f README.md
          test -d apps
          test -d .github/workflows

  frontend:
    name: Frontend - Flutter analyze and test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend availability
        id: frontend
        shell: bash
        run: |
          if [ -f apps/flutter/pubspec.yaml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Flutter frontend is not present yet; skipping frontend validation."
          fi

      - name: Set up Flutter
        if: steps.frontend.outputs.available == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get dependencies
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/flutter
        run: flutter pub get

      - name: Analyze
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/flutter
        run: flutter analyze

      - name: Run tests
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/flutter
        run: flutter test

  backend:
    name: Backend - NestJS lint, test and build
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'backend' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jcp
          POSTGRES_PASSWORD: jcp
          POSTGRES_DB: jain_community_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jcp -d jain_community_platform"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check backend availability
        id: backend
        shell: bash
        run: |
          if [ -f apps/api/package.json ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "NestJS backend is not present yet; skipping backend validation."
          fi

      - name: Set up Node.js
        if: steps.backend.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        run: npm run prisma:generate --if-present

      - name: Apply database migrations
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm run prisma:migrate:deploy --if-present

      - name: Lint
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        run: npm run lint --if-present

      - name: Unit tests
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm test --if-present

      - name: Integration tests
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm run test:integration --if-present

      - name: Build
        if: steps.backend.outputs.available == 'true'
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://jcp:jcp@localhost:5432/jain_community_platform
        run: npm run build --if-present
