services:
  - type: web
    name: jcp-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: jain-community-platform
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY_BASE64
        sync: false
      - key: FIREBASE_BOOTSTRAP_ENABLED
        value: "false"
      - key: FIREBASE_BOOTSTRAP_TENANT_ID
        sync: false
      - key: FIREBASE_BOOTSTRAP_TENANT_SLUG
        sync: false
      - key: FIREBASE_BOOTSTRAP_TENANT_NAME
        sync: false
      - key: FIREBASE_BOOTSTRAP_TENANT_HOSTNAME
        sync: false
      - key: FIREBASE_BOOTSTRAP_ADMIN_SUBJECT
        sync: false
      - key: FIREBASE_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: FIREBASE_BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: AUTH_ISSUER
        value: https://securetoken.google.com/jain-community-platform
      - key: AUTH_AUDIENCE
        value: jain-community-platform
      - key: AUTH_JWKS_URL
        value: https://www.googleapis.com/robot/v1/metadata/x509/securetoken@system.gserviceaccount.com
      - key: REDIS_URL
        sync: false
